name: PowerAI ONE domain tests

concurrency:
  group: powerai-one-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feature/powerai-one
    paths:
      - "POWERAI_ONE/**"
      - "package.json"
      - "build.mjs"
      - "index.html"
      - ".github/workflows/powerai-one-tests.yml"
  pull_request:
    paths:
      - "POWERAI_ONE/**"
      - ".github/workflows/powerai-one-tests.yml"

permissions:
  contents: read

jobs:
  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static website including ONE assets
        run: npm run build
      - name: Run domain tests
        run: node POWERAI_ONE/domain.test.js
      - name: Run portfolio service tests
        run: node POWERAI_ONE/portfolio-service.test.js
      - name: Run unified selector tests
        run: node POWERAI_ONE/unified-selector.test.js
      - name: Run unified selector exact-oracle tests
        run: node POWERAI_ONE/selector-oracle.test.js
      - name: Run unified selector scaling benchmark
        run: node POWERAI_ONE/selector-benchmark.test.js
      - name: Run unified selector reliability suite
        run: node POWERAI_ONE/selector-reliability.test.js
      - name: Run walk-forward evaluator tests
        run: node POWERAI_ONE/walk-forward-evaluator.test.js
      - name: Run Track B historical walk-forward integration tests
        run: node POWERAI_ONE/walk-forward-track-b.test.js
      - name: Run Track C/D walk-forward integration tests
        run: node POWERAI_ONE/walk-forward-cd.test.js
      - name: Run historical reverse-analysis tests
        run: node POWERAI_ONE/historical-reverse-analysis.test.js
      - name: Run unified pipeline tests
        run: node POWERAI_ONE/unified-portfolio-pipeline.test.js
      - name: Run adaptive governor tests
        run: node POWERAI_ONE/adaptive-governor.test.js
      - name: Run adaptive shadow runner tests
        run: node POWERAI_ONE/adaptive-shadow-runner.test.js
      - name: Run challenger evidence gate tests
        run: node POWERAI_ONE/challenger-evidence-gate.test.js
      - name: Run post-draw evaluation tests
        run: node POWERAI_ONE/after-draw-evaluation.test.js
      - name: Run unified ONE runtime tests
        run: node POWERAI_ONE/one-runtime.test.js
      - name: Run Track A adapter tests
        run: node POWERAI_ONE/track-a-adapter.test.js

      - name: Run Track B unified provider tests
        run: node POWERAI_ONE/track-b-provider.test.js
      - name: Run Track C constrained adapter tests
        run: node POWERAI_ONE/track-c-adapter.test.js
      - name: Run Track L learned candidate tests
        run: node POWERAI_ONE/track-l-adapter.test.js
      - name: Run Track L prequential calibration tests
        run: node POWERAI_ONE/track-l-walk-forward.test.js
      - name: Run Track L unified provider tests
        run: node POWERAI_ONE/track-l-provider.test.js
      - name: Run Track D candidate adapter tests
        run: node POWERAI_ONE/track-d-adapter.test.js
      - name: Run Track D unified provider tests
        run: node POWERAI_ONE/track-d-provider.test.js
