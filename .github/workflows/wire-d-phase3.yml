name: Wire Track D Phase 3

on:
  push:
    branches:
      - feature/adaptive-track-d

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/adaptive-track-d
      - name: Load adaptive cycle and update implementation status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          anchor='<script src="adaptive-d-ui.js?v=0.2"></script>'
          insert=anchor+'\n<script src="adaptive-d-cycle.js?v=0.3"></script>'
          if 'adaptive-d-cycle.js' not in s:
              assert anchor in s, 'adaptive D UI script anchor missing'
              s=s.replace(anchor,insert,1)
              p.write_text(s)

          p=Path('ADAPTIVE_TRACK_D_PLAN.md')
          s=p.read_text()
          for old,new in {
            '- [ ] Shadow challenger storage':'- [x] Shadow challenger storage',
            '- [ ] Weight reward update from official outcomes':'- [x] Weight reward update from official outcomes',
            '- [ ] Feature quarantine':'- [x] Feature quarantine',
            '- [ ] Challenger tournament':'- [x] Challenger tournament',
            '- [ ] Stress-test promote gate':'- [x] Stress-test promote gate',
            '- [ ] Failure diagnosis':'- [x] Failure diagnosis',
            '- [ ] Engine lineage/memory UI':'- [x] Engine lineage/memory UI',
            '- [ ] Orthogonality vs A/B/C/L':'- [x] Orthogonality vs A/B/C/L',
          }.items():
              s=s.replace(old,new)
          p.write_text(s)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ADAPTIVE_TRACK_D_PLAN.md
          if git diff --cached --quiet; then
            echo "Nothing to wire"
            exit 0
          fi
          git commit -m "Wire Track D adaptive cycle into app"
          git push origin HEAD:feature/adaptive-track-d
