name: Polish Track D wording

on:
  push:
    branches:
      - feature/adaptive-track-d

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/adaptive-track-d
      - name: Replace last technical phrases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('adaptive-d-ui.js')
          s=p.read_text()
          reps={
            "Snapshot dựng lại khớp hoàn toàn.":"Bộ đã lưu dựng lại khớp hoàn toàn.",
            "Không dựng lại được snapshot: ":"Không dựng lại được bộ đã lưu: ",
            "Kỳ này đã có kết quả nên D chỉ ở chế độ Replay.":"Kỳ này đã có kết quả nên D chỉ cho xem lại.",
            "D không khóa vì snapshot không dựng lại khớp: ":"D không khóa vì bộ đã lưu không dựng lại khớp: ",
            "<small>Tổng hit ${x.D.total??0}</small>":"<small>Tổng số trùng ${x.D.total??0}</small>"
          }
          for old,new in reps.items():
            if old not in s:
              raise SystemExit('missing wording anchor: '+old)
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          node --check adaptive-d-ui.js
          npm run build
          node tests/adaptive-d-ui-static.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adaptive-d-ui.js
          git rm .github/workflows/polish-d-language.yml
          git commit -m "Polish remaining Track D wording"
          git push origin HEAD:feature/adaptive-track-d
