name: Apply High Prize Performance Summary

on:
  push:
    branches:
      - feature/power-target-selector

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/power-target-selector

      - name: Add high-prize multi-draw summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('app.js')
          s=p.read_text()

          old='''function rc97Stat(key,logs){\n  const rows=logs.map(l=>({id:Number(l.targetId),s:l?.[key]})).filter(x=>x.s&&Number.isFinite(Number(x.s.best)));\n  const n=rows.length,sum=f=>rows.reduce((a,x)=>a+(Number(f(x.s))||0),0);\n  const prizes={jp1:sum(s=>s.jp1),jp2:sum(s=>s.jp2),first:sum(s=>s.first),second:sum(s=>s.second),third:sum(s=>s.third)};\n  return{key,n,rows,avgBest:n?sum(s=>s.best)/n:0,avgTotal:n?sum(s=>s.total)/n:0,ge3:rows.filter(x=>Number(x.s.best)>=3).length,ge4:rows.filter(x=>Number(x.s.best)>=4).length,ge5:rows.filter(x=>Number(x.s.best)>=5).length,maxBest:n?Math.max(...rows.map(x=>Number(x.s.best)||0)):0,prizes};\n}'''
          new='''function rc97ScoreForLog(log,key){\n  const raw=log?.[key];\n  try{return typeof prizeSummaryScore==='function'?prizeSummaryScore(log,key,raw):raw}catch(e){return raw}\n}\nfunction rc97Stat(key,logs){\n  const rows=logs.map(l=>({id:Number(l.targetId),s:rc97ScoreForLog(l,key)})).filter(x=>x.s&&Number.isFinite(Number(x.s.best)));\n  const n=rows.length,sum=f=>rows.reduce((a,x)=>a+(Number(f(x.s))||0),0);\n  const prizes={jp1:sum(s=>s.jp1),jp2:sum(s=>s.jp2),first:sum(s=>s.first),second:sum(s=>s.second),third:sum(s=>s.third)};\n  return{key,n,rows,avgBest:n?sum(s=>s.best)/n:0,avgTotal:n?sum(s=>s.total)/n:0,ge3:rows.filter(x=>Number(x.s.best)>=3).length,ge4:rows.filter(x=>Number(x.s.best)>=4).length,ge5:rows.filter(x=>Number(x.s.best)>=5).length,maxBest:n?Math.max(...rows.map(x=>Number(x.s.best)||0)):0,prizes};\n}\nfunction rc97HighPrizeStats(logs){\n  const stats=['A','B','C','L'].map(k=>{\n    const s=rc97Stat(k,logs);\n    const highDraws=s.rows.filter(x=>Number(x.s.best)>=4).length;\n    const eliteDraws=s.rows.filter(x=>Number(x.s.best)>=5).length;\n    return{...s,highDraws,eliteDraws,highRate:s.n?highDraws/s.n:0};\n  });\n  const max=Math.max(0,...stats.map(s=>s.highDraws));\n  const leaders=max>0?stats.filter(s=>s.highDraws===max).map(s=>s.key):[];\n  return{stats,max,leaders};\n}\nfunction rc97HighPrizeBoard(logs){\n  const r=rc97HighPrizeStats(logs);\n  if(!r.stats.some(s=>s.n))return '<section class="rc97HighPrizeBoard"><div class="rc97HighPrizeHead"><div><span>THÀNH TÍCH GIẢI CAO</span><b>Chưa có đủ log official</b></div></div><p class="rc97HighPrizeNote">Mục này chỉ tính các kỳ prospective đã khóa và sau đó được feed chính thức đối chiếu.</p></section>';\n  const leadText=r.leaders.length?r.leaders.join(' / ')+' • '+r.max+' kỳ':'Chưa track nào có Best ≥4/6';\n  const cards=r.stats.map(s=>{\n    const leader=r.leaders.includes(s.key)&&r.max>0;\n    const p=s.prizes;\n    return '<article class="rc97HighPrizeCard track'+s.key+(leader?' leader':'')+'"><div class="rc97HighPrizeCardHead"><b>'+s.key+'</b><span>'+rc97TrackName(s.key).split('•')[1].trim()+'</span>'+(leader?'<em>DẪN ĐẦU</em>':'')+'</div><strong>'+s.highDraws+' / '+s.n+' kỳ</strong><small>Best ≥4/6 • '+rc97Pct(s.highDraws,s.n)+'</small><div class="rc97HighPrizeBreakdown"><span>≥5: <b>'+s.eliteDraws+'</b></span><span>JP1 <b>'+(p.jp1||0)+'</b></span><span>JP2 <b>'+(p.jp2||0)+'</b></span><span>Nhất <b>'+(p.first||0)+'</b></span><span>Nhì <b>'+(p.second||0)+'</b></span></div></article>';\n  }).join('');\n  return '<section class="rc97HighPrizeBoard"><div class="rc97HighPrizeHead"><div><span>THÀNH TÍCH GIẢI CAO • NHIỀU KỲ</span><b>Dẫn đầu theo số kỳ có Best ≥4/6: '+leadText+'</b></div><small>Best ≥4/6 tương ứng ít nhất 1 vé đạt Giải Nhì hoặc cao hơn.</small></div><div class="rc97HighPrizeGrid">'+cards+'</div><p class="rc97HighPrizeNote">Đây là thống kê kết quả đã ghi nhận trên log official của tài khoản, không phải xác suất trúng ở kỳ tiếp theo. Vì L có thể có ít kỳ tham gia hơn, xem cả số kỳ và tỷ lệ.</p></section>';\n}'''
          assert old in s, 'rc97Stat anchor not found'
          s=s.replace(old,new,1)

          old="""  return '<div class=\"rc97SummaryNote\">Chỉ dùng log <b>feed chính thức</b> đã lưu. Kết quả nhập tay và replay không được tính vào Performance Center.</div><div class=\"rc97TrackGrid\">'+cards+'</div>'+table;"""
          new="""  return '<div class=\"rc97SummaryNote\">Chỉ dùng log <b>feed chính thức</b> đã lưu. Kết quả nhập tay và replay không được tính vào Performance Center.</div>'+rc97HighPrizeBoard(logs)+'<div class=\"rc97TrackGrid\">'+cards+'</div>'+table;"""
          assert old in s, 'rc97Overview return anchor not found'
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('style.css')
          s=p.read_text()
          anchor='''.rc97TrackGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}'''
          css='''.rc97HighPrizeBoard{margin:0 0 12px;padding:12px;border:1px solid rgba(105,227,233,.20);border-radius:13px;background:linear-gradient(180deg,rgba(10,32,49,.82),rgba(5,19,31,.72))}\n.rc97HighPrizeHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:9px}.rc97HighPrizeHead span{display:block;font-size:8px;font-weight:900;letter-spacing:.12em;color:var(--cyan)}.rc97HighPrizeHead b{display:block;margin-top:3px;font-size:12px}.rc97HighPrizeHead small{max-width:330px;text-align:right;color:var(--muted2);font-size:8px;line-height:1.45}\n.rc97HighPrizeGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.rc97HighPrizeCard{border:1px solid var(--line);border-radius:11px;padding:10px;background:rgba(4,16,26,.58)}.rc97HighPrizeCard.leader{border-color:rgba(105,227,233,.52);box-shadow:0 0 0 2px rgba(105,227,233,.05)}.rc97HighPrizeCard.trackA{border-top-color:rgba(100,181,255,.58)}.rc97HighPrizeCard.trackB{border-top-color:rgba(255,201,107,.58)}.rc97HighPrizeCard.trackC{border-top-color:rgba(169,138,255,.60)}.rc97HighPrizeCard.trackL{border-top-color:rgba(113,227,173,.58)}.rc97HighPrizeCardHead{display:grid;grid-template-columns:25px 1fr auto;gap:6px;align-items:center}.rc97HighPrizeCardHead>b{width:25px;height:25px;display:grid;place-items:center;border-radius:7px;background:rgba(255,255,255,.05)}.rc97HighPrizeCardHead span{font-size:9px;font-weight:800}.rc97HighPrizeCardHead em{font-style:normal;font-size:7px;color:#b9fbff}.rc97HighPrizeCard>strong{display:block;font-size:20px;margin:9px 0 1px}.rc97HighPrizeCard>small{display:block;font-size:8px;color:var(--muted2)}.rc97HighPrizeBreakdown{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.rc97HighPrizeBreakdown span{font-size:7px;padding:4px 5px;border:1px solid var(--line);border-radius:7px;color:var(--muted)}.rc97HighPrizeBreakdown b{color:var(--text)}.rc97HighPrizeNote{margin:9px 0 0;color:var(--muted2);font-size:8px;line-height:1.5}\n'''+anchor
          assert anchor in s, 'rc97TrackGrid css anchor not found'
          s=s.replace(anchor,css,1)
          s=s.replace('@media(max-width:1100px){.rc97TrackGrid{grid-template-columns:repeat(2,minmax(0,1fr))}', '@media(max-width:1100px){.rc97HighPrizeGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.rc97TrackGrid{grid-template-columns:repeat(2,minmax(0,1fr))}',1)
          s=s.replace('@media(max-width:700px){.rc97PerfTabs', '@media(max-width:700px){.rc97HighPrizeHead{display:block}.rc97HighPrizeHead small{display:block;text-align:left;margin-top:5px}.rc97HighPrizeGrid{grid-template-columns:1fr}.rc97PerfTabs',1)
          p.write_text(s)

          p=Path('tests/browser-smoke.mjs')
          s=p.read_text()
          anchor='''  const perfSources = await page.evaluate(() => rc97Logs().map(x => x?.source));\n  assert.ok(perfSources.every(x => x === 'feed'), `${name}: Performance Center included non-feed logs`);'''
          repl='''  const perfSources = await page.evaluate(() => rc97Logs().map(x => x?.source));\n  assert.ok(perfSources.every(x => x === 'feed'), `${name}: Performance Center included non-feed logs`);\n  assert.equal(await page.locator('.rc97HighPrizeBoard').count(), 1, `${name}: high-prize multi-draw summary missing`);\n  const highPrizeCheck = await page.evaluate(() => {\n    const score=(best,{jp1=0,jp2=0,first=0,second=0,third=0}={})=>({best,total:best,jp1,jp2,first,second,third,g3:0,g4:second,g5:first+jp2+jp1});\n    const logs=[\n      {source:'feed',targetId:1,A:score(4,{second:1}),B:score(3,{third:1}),C:score(5,{first:1}),L:score(4,{second:1})},\n      {source:'feed',targetId:2,A:score(5,{jp2:1}),B:score(3,{third:1}),C:score(3,{third:1}),L:score(2)},\n      {source:'feed',targetId:3,A:score(3,{third:1}),B:score(2),C:score(3,{third:1})}\n    ];\n    const r=rc97HighPrizeStats(logs);\n    return {counts:Object.fromEntries(r.stats.map(s=>[s.key,s.highDraws])),leaders:r.leaders,max:r.max};\n  });\n  assert.deepEqual(highPrizeCheck,{counts:{A:2,B:0,C:1,L:1},leaders:['A'],max:2},`${name}: high-prize draw counting regression`);'''
          assert anchor in s, 'browser smoke performance anchor not found'
          s=s.replace(anchor,repl,1)
          p.write_text(s)
          PY

          node --check app.js
          npm run build
          cmp -s app.js dist/app.js
          cmp -s style.css dist/style.css
          git diff --check

      - name: Commit high-prize summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css tests/browser-smoke.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add multi-draw high prize performance summary"
          git push origin HEAD:feature/power-target-selector
