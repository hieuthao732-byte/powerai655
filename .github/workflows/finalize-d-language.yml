name: Finalize Track D wording

on:
  push:
    branches:
      - feature/adaptive-track-d

permissions:
  contents: write

jobs:
  wording:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/adaptive-track-d
      - name: Remove remaining technical wording from D UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('adaptive-d-ui.js')
          s=p.read_text()
          replacements={
            '<div class="head"><div><div class="sectionKicker dText">20 VÉ D</div><h2>🎟 Portfolio D</h2><p id="dPortfolioNote">Đang dựng model...</p></div></div>':'<div class="head"><div><div class="sectionKicker dText">20 VÉ D</div><h2>🎟 Bộ 20 vé D</h2><p id="dPortfolioNote">Đang tạo bộ D...</p></div></div>',
            "if(!p?.tickets?.length){box.innerHTML='<div class=\"notice\">Chưa dựng được portfolio D.</div>';return}":"if(!p?.tickets?.length){box.innerHTML='<div class=\"notice\">Chưa tạo được 20 vé D.</div>';return}",
            "D chỉ dùng dữ liệu trước ${drawLabel(targetId)}. Cutoff <b>#${String(currentModel.cutoffId).padStart(5,'0')}</b>.":"D chỉ dùng dữ liệu trước ${drawLabel(targetId)}. Dữ liệu dùng đến <b>#${String(currentModel.cutoffId).padStart(5,'0')}</b>.",
            "${lock?'ĐÃ KHÓA':known?'REPLAY':'CHƯA KHÓA'}":"${lock?'ĐÃ KHÓA':known?'XEM LẠI':'CHƯA KHÓA'}",
            "el('dAudit').innerHTML=`<span>Coverage <b>${audit.coverage}/55</b></span><span>Exposure <b>${audit.minExposure}–${audit.maxExposure}</b></span><span>Pair lặp <b>${audit.repeatedPairs}</b></span><span>Max overlap <b>${audit.maxOverlap}</b></span><span>Entropy <b>${audit.entropy}</b></span>`;":"el('dAudit').innerHTML=`<span>Số được phủ <b>${audit.coverage}/55</b></span><span>Số lần xuất hiện <b>${audit.minExposure}–${audit.maxExposure}</b></span><span>Cặp bị lặp <b>${audit.repeatedPairs}</b></span><span>Trùng tối đa giữa 2 vé <b>${audit.maxOverlap}</b></span><span>Độ phân tán <b>${audit.entropy}</b></span>`;",
            "known?'Replay • không khóa':'🔒 Khóa bộ D'":"known?'Xem lại • không khóa':'🔒 Khóa bộ D'",
            "showToast?.(`Đã khóa bộ D cho ${drawLabel(targetId)} • integrity VERIFIED.`, 'good')":"showToast?.(`Đã khóa bộ D cho ${drawLabel(targetId)} • kiểm tra dữ liệu hợp lệ.`, 'good')",
            "return k==='D'?'D • Adaptive':baseName(k)":"return k==='D'?'D • Tự điều chỉnh':baseName(k)",
            "<span>Adaptive</span>":"<span>Tự điều chỉnh</span>",
            "<span>Best-hit TB</span>":"<span>Trùng cao nhất TB</span>",
            "<span>Best ≥3</span>":"<span>Kỳ có vé ≥3</span>",
            "<span>Best ≥4</span>":"<span>Kỳ có vé ≥4</span>",
            "<span>Best ≥5</span>":"<span>Kỳ có vé ≥5</span>",
            "<div class=\"rc97RecentHead\"><b>Track D</b><span>prospective official</span></div>":"<div class=\"rc97RecentHead\"><b>Bộ D</b><span>đã khóa trước kỳ</span></div>",
            "<span>D • PERFORMANCE</span><h3>D • Adaptive</h3><p>Chỉ tổng hợp portfolio D đã khóa trước kết quả và được feed chính thức xác nhận.</p></div><em>${s.n} KỲ OFFICIAL</em>":"<span>D • KẾT QUẢ</span><h3>D • Tự điều chỉnh</h3><p>Chỉ tính các bộ D đã khóa trước kỳ quay và sau đó có kết quả chính thức.</p></div><em>${s.n} KỲ ĐÃ KIỂM CHỨNG</em>",
            "<span>Best-hit trung bình</span>":"<span>Trùng cao nhất trung bình</span>",
            "<span>Best cao nhất</span>":"<span>Mức trùng cao nhất</span>",
            "<span>Kỳ Best ≥3</span>":"<span>Kỳ có vé trùng ≥3</span>",
            "<span>Kỳ Best ≥4</span>":"<span>Kỳ có vé trùng ≥4</span>",
            "<b>Best ${x.s.best}/6</b>":"<b>Cao nhất ${x.s.best}/6</b>",
            "<small>Tổng hit ${x.s.total??0}</small>":"<small>Tổng số trùng ${x.s.total??0}</small>",
            "<div class=\"notice\">Chưa có log official cho D.</div>":"<div class=\"notice\">Chưa có kỳ D nào được kiểm chứng chính thức.</div>"
          }
          for old,new in replacements.items():
            if old not in s:
              raise SystemExit('missing wording anchor: '+old[:100])
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          node --check adaptive-d-ui.js
          npm run build
          node tests/adaptive-d-ui-static.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adaptive-d-ui.js
          git rm .github/workflows/finalize-d-language.yml
          git commit -m "Finish plain Vietnamese wording for Track D"
          git push origin HEAD:feature/adaptive-track-d
