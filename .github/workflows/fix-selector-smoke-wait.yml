name: Fix Selector Smoke Wait

on:
  push:
    branches:
      - feature/power-target-selector

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/power-target-selector
      - name: Wait for replay cutoff rebuild in smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/browser-smoke.mjs')
          s=p.read_text()
          old='''  await targetSelect.selectOption(replayValue);\n  await page.waitForFunction(v => Number(String(document.getElementById('targetId')?.textContent||'').replace(/\\D/g,''))===Number(v), replayValue, { timeout: 90000 });\n  const replayCutoff = Number((await page.locator('#cutoffId').innerText()).replace(/\\D/g,''));\n  const replayTarget = Number((await page.locator('#targetId').innerText()).replace(/\\D/g,''));\n  assert.ok(replayCutoff < replayTarget, `${name}: selector replay leaked target/future history`);'''
          new='''  await targetSelect.selectOption(replayValue);\n  await page.waitForFunction(v => Number(String(document.getElementById('targetId')?.textContent||'').replace(/\\D/g,''))===Number(v), replayValue, { timeout: 90000 });\n  await page.waitForFunction(() => {\n    const t=Number(String(document.getElementById('targetId')?.textContent||'').replace(/\\D/g,''));\n    const c=Number(String(document.getElementById('cutoffId')?.textContent||'').replace(/\\D/g,''));\n    return Number.isFinite(t)&&Number.isFinite(c)&&c>0&&c<t;\n  }, null, { timeout: 90000 });\n  const replayCutoff = Number((await page.locator('#cutoffId').innerText()).replace(/\\D/g,''));\n  const replayTarget = Number((await page.locator('#targetId').innerText()).replace(/\\D/g,''));\n  assert.ok(replayCutoff < replayTarget, `${name}: selector replay leaked target/future history`);'''
          assert old in s, 'selector smoke anchor not found'
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser-smoke.mjs
          git commit -m "Wait for Power replay cutoff rebuild in smoke test"
          git push origin HEAD:feature/power-target-selector
