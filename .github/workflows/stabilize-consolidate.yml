name: Stabilize Source Consolidation

on:
  push:
    branches:
      - stabilization/v1
    paths:
      - '.github/workflows/stabilize-consolidate.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build current RC9.7 exactly as production does
        run: npm run build

      - name: Smoke-check built output before materializing
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/app.js
          test -s dist/index.html
          test -s dist/style.css
          node --check dist/app.js
          grep -q 'RC9.7' dist/app.js
          grep -q 'PERFORMANCE CENTER A/B/C/L' dist/app.js
          grep -q 'NUMBER INTELLIGENCE 01–55' dist/app.js
          grep -q 'NAVIGATION RESTRUCTURE' dist/app.js
          grep -q 'RESULT DOCK' dist/app.js
          grep -q 'BÓNG VÀNG HIGHLIGHT' dist/app.js
          grep -q 'RC9.7' dist/index.html

      - name: Materialize final built behavior into source
        shell: bash
        run: |
          set -euo pipefail
          cp dist/app.js app.js
          cp dist/index.html index.html
          cp dist/style.css style.css

          cat > build.mjs <<'NODE'
          import { rmSync, mkdirSync, copyFileSync, existsSync } from 'node:fs';
          import { join } from 'node:path';

          const files = [
            'index.html',
            'app.js',
            'auth.js',
            'style.css',
            'favicon.svg',
            'google933e1c79e6843890.html',
            'robots.txt',
            'site.webmanifest',
            'sitemap.xml'
          ];

          rmSync('dist', { recursive: true, force: true });
          mkdirSync('dist', { recursive: true });
          for (const file of files) {
            if (!existsSync(file)) throw new Error(`Missing required static file: ${file}`);
            copyFileSync(file, join('dist', file));
          }
          console.log('Stable build complete — source copied to dist without post-build mutation.');
          NODE

          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          p.scripts = { build: 'node build.mjs' };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE

          rm -f rc*.mjs

      - name: Rebuild from consolidated source and verify parity markers
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          node --check app.js
          node --check dist/app.js
          cmp -s app.js dist/app.js
          cmp -s index.html dist/index.html
          cmp -s style.css dist/style.css
          grep -q 'PERFORMANCE CENTER A/B/C/L' app.js
          grep -q 'NUMBER INTELLIGENCE 01–55' app.js
          grep -q 'NAVIGATION RESTRUCTURE' app.js
          grep -q 'RESULT DOCK' app.js
          grep -q 'BÓNG VÀNG HIGHLIGHT' app.js
          if compgen -G 'rc*.mjs' >/dev/null; then
            echo 'Unexpected RC patch files remain:'
            ls rc*.mjs
            exit 1
          fi

      - name: Record consolidation notes
        shell: bash
        run: |
          cat > SOURCE_CONSOLIDATION.md <<'EOF'
          # Source consolidation

          The RC8.9–RC9.7 post-build mutation chain has been materialized into the checked-in web source.

          ## Stable source of truth
          - `app.js`
          - `index.html`
          - `style.css`
          - `auth.js`

          ## Build
          `npm run build` now runs only `node build.mjs`.
          `build.mjs` performs a deterministic copy of static source files into `dist/`; it no longer patches application code.

          ## Removed post-build files
          All `rc*.mjs` migration/patch scripts are removed from the stabilization branch after their behavior is materialized.

          ## Compatibility constraints preserved
          - existing localStorage key names
          - existing Supabase/auth integration
          - lock/log object formats
          - A/B/C/L algorithms and generated portfolios
          - manual verification guard
          - replay semantics
          - Jackpot 1/2 + prize board logic
          - green main-hit and gold special-ball rendering
          - Number Intelligence anti-leakage rule
          - Performance Center official-feed-only aggregation

          This branch must still pass browser smoke tests before merging to `main`.
          EOF

      - name: Commit consolidated source to stabilization branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hieuthao732-byte'
          git config user.email 'hieuthao732@gmail.com'
          git add app.js index.html style.css build.mjs package.json SOURCE_CONSOLIDATION.md
          git add -u -- 'rc*.mjs'
          if git diff --cached --quiet; then
            echo 'No consolidation changes to commit.'
          else
            git commit -m 'Consolidate RC9.7 built behavior into stable source'
            git push origin HEAD:stabilization/v1
          fi
