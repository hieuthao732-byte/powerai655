name: Simplify Track D wording

on:
  push:
    branches:
      - feature/adaptive-track-d

permissions:
  contents: write

jobs:
  simplify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/adaptive-track-d
      - name: Replace technical labels with plain Vietnamese
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('adaptive-d-ui.js')
          s=p.read_text()

          replacements={
            "btn.textContent='D • Adaptive';":"btn.textContent='D • Tự điều chỉnh';",
            "<div><div class=\"sectionKicker dText\">D • ADAPTIVE RESEARCH ENGINE</div><h2>🧬 Bộ D — Engine thích nghi</h2><p>D1–D4 chạy đa cửa sổ, tạo riêng 20 vé D và chỉ ghi nhận hiệu suất khi bộ đã khóa trước kết quả chính thức.</p></div>":"<div><div class=\"sectionKicker dText\">D • TỰ KIỂM TRA & TỰ ĐIỀU CHỈNH</div><h2>🧬 Bộ D — Tự kiểm tra và đổi cách chọn khi cần</h2><p>D dùng 4 cách phân tích cùng lúc, tạo riêng 20 vé và chỉ tính thành tích khi bộ đã khóa trước kết quả chính thức.</p></div>",
            "<div class=\"dStat\"><span>Engine</span><b id=\"dEngine\">—</b><small id=\"dModelHash\">—</small><small id=\"dIntegrity\">integrity —</small></div>":"<div class=\"dStat\"><span>Phiên bản D</span><b id=\"dEngine\">—</b><small id=\"dModelHash\">—</small><small id=\"dIntegrity\">Kiểm tra dữ liệu —</small></div>",
            "<div class=\"dStat\"><span>Confidence</span><b id=\"dConfidence\">—</b><small id=\"dDisagreement\">—</small></div>":"<div class=\"dStat\"><span>Độ đồng thuận</span><b id=\"dConfidence\">—</b><small id=\"dDisagreement\">—</small></div>",
            "<div class=\"dStat\"><span>Official log</span><b id=\"dOfficialCount\">0</b><small>prospective + feed</small></div>":"<div class=\"dStat\"><span>Số kỳ đã kiểm chứng</span><b id=\"dOfficialCount\">0</b><small>đã khóa trước kỳ + kết quả chính thức</small></div>",
            "<div class=\"head\"><div><div class=\"sectionKicker dText\">D1 / D2 / D3 / D4</div><h2>🧠 Expert & đa cửa sổ</h2></div></div>":"<div class=\"head\"><div><div class=\"sectionKicker dText\">4 CÁCH PHÂN TÍCH CỦA D</div><h2>🧠 4 cách phân tích đang phối hợp</h2></div></div>",
            "<div class=\"analyticsCard\"><h3>📐 Portfolio audit</h3><div id=\"dAudit\" class=\"dAudit\"></div></div>":"<div class=\"analyticsCard\"><h3>📐 Kiểm tra độ phân tán</h3><div id=\"dAudit\" class=\"dAudit\"></div></div>",
            "<div class=\"analyticsCard\"><h3>🧪 Matched-null</h3><div id=\"dNullStatus\" class=\"dAudit\"></div></div>":"<div class=\"analyticsCard\"><h3>🧪 So với bộ ngẫu nhiên</h3><div id=\"dNullStatus\" class=\"dAudit\"></div></div>",
            "<div class=\"head\"><div><div class=\"sectionKicker\">D PERFORMANCE</div><h2>📈 Official history</h2><p>Chỉ các bộ D đã khóa trước kỳ quay và được feed chính thức xác nhận.</p></div></div>":"<div class=\"head\"><div><div class=\"sectionKicker\">KẾT QUẢ D</div><h2>📈 Lịch sử kiểm chứng</h2><p>Chỉ tính những bộ D đã khóa trước kỳ quay và sau đó có kết quả chính thức.</p></div></div>",
            "${p.locked?'ĐÃ KHÓA':'candidate'}":"${p.locked?'ĐÃ KHÓA':'CHƯA KHÓA'}",
            "el('dModelHash').textContent='model '+currentModel.modelHash+' • cutoff #'+String(currentModel.cutoffId).padStart(5,'0');":"el('dModelHash').textContent='mã '+currentModel.modelHash+' • dữ liệu đến #'+String(currentModel.cutoffId).padStart(5,'0');",
            "el('dIntegrity').textContent='integrity '+(integrity?.status|| (lock?'CHỜ KIỂM TRA':'CANDIDATE'));":"el('dIntegrity').textContent='Kiểm tra dữ liệu '+dIntegrityLabel(integrity?.status|| (lock?'CHỜ KIỂM TRA':'CANDIDATE'));",
            "el('dState').textContent=drift.state;":"el('dState').textContent=dStateLabel(drift.state);",
            "el('dConfidence').textContent=conf.confidence;":"el('dConfidence').textContent=dConfidenceLabel(conf.confidence);",
            "el('dDisagreement').textContent='disagreement '+fmt(conf.disagreement);":"el('dDisagreement').textContent='Mức bất đồng '+fmt(conf.disagreement);",
            "el('dWeights').innerHTML=['D1','D2','D3','D4'].map(k=>`<div class=\"dExpert\"><span>${k}</span><b>${(currentModel.weights[k]*100).toFixed(1)}%</b><small>${({D1:'Residual Pair',D2:'Gap Transition',D3:'Shape Conditional',D4:'Spectral Graph'})[k]}</small></div>`).join('');":"el('dWeights').innerHTML=['D1','D2','D3','D4'].map(k=>`<div class=\"dExpert\"><span>${k}</span><b>${(currentModel.weights[k]*100).toFixed(1)}%</b><small>${({D1:'Liên kết cặp số',D2:'Nhịp xuất hiện',D3:'Mẫu kỳ quay',D4:'Mạng liên kết số'})[k]}</small></div>`).join('');",
            "el('dNullStatus').innerHTML=last?.D?.null?`<span>Kỳ gần nhất <b>${drawLabel(last.targetId)}</b></span><span>Best D <b>${last.D.best}/6</b></span><span>Null mean <b>${fmt(last.D.null.bestMean)}</b></span><span>p(best) <b>${fmt(last.D.null.pBest)}</b></span>`:'<span>Chưa có kỳ D official để benchmark.</span>';":"el('dNullStatus').innerHTML=last?.D?.null?`<span>Kỳ gần nhất <b>${drawLabel(last.targetId)}</b></span><span>Cao nhất D <b>${last.D.best}/6</b></span><span>Ngẫu nhiên trung bình <b>${fmt(last.D.null.bestMean)}</b></span><span>Tỷ lệ ngẫu nhiên đạt bằng/tốt hơn <b>${fmt(last.D.null.pBest)}</b></span>`:'<span>Chưa có kỳ D chính thức để so sánh.</span>';",
            "el('dPortfolioNote').textContent=lock?'Portfolio đã khóa; hash '+(lock.portfolioHash||'—'):'Candidate deterministic • hash '+currentPortfolio.hash;":"el('dPortfolioNote').textContent=lock?'Bộ 20 vé đã khóa • mã '+(lock.portfolioHash||'—'):'Bộ 20 vé chưa khóa • mã '+currentPortfolio.hash;",
            "if(!rows.length){box.innerHTML='<div class=\"notice\">Chưa có log D official.</div>';return}":"if(!rows.length){box.innerHTML='<div class=\"notice\">Chưa có kỳ D nào được kiểm chứng chính thức.</div>';return}",
            "<b>Best ${x.D.best}/6</b>":"<b>Cao nhất ${x.D.best}/6</b>",
            "<small>Null ${fmt(x.D?.null?.bestMean)}</small>":"<small>Ngẫu nhiên TB ${fmt(x.D?.null?.bestMean)}</small>"
          }

          for old,new in replacements.items():
            if old not in s:
              raise SystemExit(f'missing UI anchor: {old[:90]}')
            s=s.replace(old,new,1)

          helper="""  function dStateLabel(x){return ({STABLE:'ỔN ĐỊNH',WARMUP:'ĐANG TÍCH LŨY DỮ LIỆU',DRIFT:'HIỆU SUẤT ĐANG YẾU',COOLDOWN:'ĐANG CHỜ THÊM KỲ',CHALLENGER_TEST:'ĐANG THỬ CÁCH MỚI'})[String(x)]||String(x||'—')}\n  function dConfidenceLabel(x){return ({HIGH:'TÍN HIỆU KHÁ ĐỒNG THUẬN',MEDIUM:'TÍN HIỆU TẠM ỔN',LOW:'TÍN HIỆU CHƯA RÕ',LOW_CONFIDENCE:'TÍN HIỆU CHƯA RÕ'})[String(x)]||String(x||'—')}\n  function dIntegrityLabel(x){return ({VERIFIED:'HỢP LỆ',INVALID:'KHÔNG HỢP LỆ',CANDIDATE:'CHƯA KHÓA','CHỜ KIỂM TRA':'CHỜ KIỂM TRA'})[String(x)]||String(x||'—')}\n"""
          anchor="  const fmt=x=>Number.isFinite(Number(x))?Number(x).toFixed(3):'—';\n"
          if helper.strip() not in s:
            if anchor not in s: raise SystemExit('fmt anchor missing')
            s=s.replace(anchor,anchor+helper,1)
          p.write_text(s)

          t=Path('tests/adaptive-d-ui-static.mjs')
          q=t.read_text()
          q=q.replace("assert.match(ui,/integrity VERIFIED/);","assert.match(ui,/Kiểm tra dữ liệu/);")
          t.write_text(q)
          PY

          git diff --check
          node --check adaptive-d-ui.js
          npm run build
          node tests/adaptive-d-ui-static.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adaptive-d-ui.js tests/adaptive-d-ui-static.mjs
          git rm .github/workflows/simplify-d-language.yml
          git commit -m "Use plain Vietnamese labels for Track D"
          git push origin HEAD:feature/adaptive-track-d
