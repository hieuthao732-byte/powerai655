name: Apply Power Target Selector

on:
  push:
    branches:
      - feature/power-target-selector

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/power-target-selector

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch Power selector UI + behavior + smoke coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # index.html
          p=Path('index.html')
          s=p.read_text()
          old='''  <div class="heroActions">\n    <button id="refreshBtn" class="ghostBtn">↻ Cập nhật dữ liệu</button>'''
          new='''  <div class="heroActions">\n    <div class="powerTargetBox">\n      <label for="targetSelect">Kỳ đang xem</label>\n      <select id="targetSelect" aria-label="Chọn kỳ Power 6/55" disabled></select>\n    </div>\n    <button id="refreshBtn" class="ghostBtn">↻ Cập nhật dữ liệu</button>'''
          assert old in s, 'index heroActions anchor not found'
          s=s.replace(old,new,1)
          p.write_text(s)

          # style.css
          p=Path('style.css')
          s=p.read_text()
          anchor='''.heroActions{display:flex;flex-direction:column;gap:9px;min-width:220px;position:relative;z-index:1}\n.heroActions small{color:var(--muted2);font-size:10px;line-height:1.45;text-align:center}'''
          repl='''.heroActions{display:flex;flex-direction:column;gap:9px;min-width:260px;position:relative;z-index:1}\n.powerTargetBox{display:flex;flex-direction:column;gap:6px;margin-bottom:2px}\n.powerTargetBox label{font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:.10em;font-weight:800}\n.powerTargetBox select{width:100%;min-width:260px;color:var(--text);background:#071522;border:1px solid var(--lineStrong);border-radius:11px;padding:11px 12px;outline:none;font-weight:760}\n.powerTargetBox select:focus{border-color:rgba(98,181,255,.75);box-shadow:0 0 0 3px rgba(77,164,238,.10)}\n.powerTargetBox select:disabled{opacity:.55}\n.heroActions small{color:var(--muted2);font-size:10px;line-height:1.45;text-align:center}'''
          assert anchor in s, 'style heroActions anchor not found'
          s=s.replace(anchor,repl,1)
          # Mobile guard: make selector fill available width.
          if '@media(max-width:760px)' in s:
              s=s.replace('@media(max-width:760px){','@media(max-width:760px){\n.powerTargetBox select{min-width:0;width:100%}',1)
          p.write_text(s)

          # app.js
          p=Path('app.js')
          s=p.read_text()
          anchor='''function previousNavigableTarget(){\n  const cur=Number(targetId);\n  const ids=draws.map(d=>Number(d.id)).filter(id=>Number.isFinite(id)&&id<cur);\n  return ids.length?ids[ids.length-1]:null;\n}\nasync function openLoggedTarget(id){'''
          repl='''function previousNavigableTarget(){\n  const cur=Number(targetId);\n  const ids=draws.map(d=>Number(d.id)).filter(id=>Number.isFinite(id)&&id<cur);\n  return ids.length?ids[ids.length-1]:null;\n}\nfunction renderTargetSelect(){\n  const sel=$("targetSelect");\n  if(!sel||!latest||!Array.isArray(draws)||!draws.length)return;\n  const next=nextNavigableTarget(),recent=draws.slice(-36).reverse(),seen=new Set(),options=[];\n  const push=(id,label)=>{id=Number(id);if(!Number.isFinite(id)||seen.has(id))return;seen.add(id);options.push(`<option value="${id}">${label}</option>`)};\n  push(next,`${drawLabel(next)} • kỳ tiếp theo`);\n  const currentOfficial=draws.find(d=>Number(d.id)===Number(targetId));\n  if(currentOfficial&&!recent.some(d=>Number(d.id)===Number(targetId)))recent.unshift(currentOfficial);\n  for(const d of recent)push(Number(d.id),`${drawLabel(d.id)} • ${d.date||"kỳ đã quay"}`);\n  sel.innerHTML=options.join("");\n  if(!seen.has(Number(targetId)))push(Number(targetId),drawLabel(targetId));\n  if(!seen.has(Number(targetId))){sel.insertAdjacentHTML("beforeend",`<option value="${Number(targetId)}">${drawLabel(targetId)}</option>`)}\n  sel.value=String(targetId);\n  sel.disabled=false;\n}\nasync function chooseTargetFromSelect(){\n  const sel=$("targetSelect");if(!sel)return;\n  const id=Number(sel.value);if(!Number.isFinite(id)||id===Number(targetId))return;\n  sel.disabled=true;\n  try{await setTarget(id)}catch(e){console.error(e);showToast?.("Không mở được kỳ đã chọn.","bad")}finally{renderTargetSelect()}\n}\nasync function openLoggedTarget(id){'''
          assert anchor in s, 'app previousNavigableTarget anchor not found'
          s=s.replace(anchor,repl,1)

          anchor='''async function setTarget(id){\n  targetId=Number(id);try{localStorage.setItem("powerai_rc6_active_target",String(targetId))}catch{}cloudSyncSoon();\n  $("targetId").textContent=drawLabel(targetId);renderTargetContexts();'''
          repl='''async function setTarget(id){\n  targetId=Number(id);try{localStorage.setItem("powerai_rc6_active_target",String(targetId))}catch{}cloudSyncSoon();\n  $("targetId").textContent=drawLabel(targetId);renderTargetSelect();renderTargetContexts();'''
          assert anchor in s, 'app setTarget anchor not found'
          s=s.replace(anchor,repl,1)

          anchor='''$("refreshBtn").onclick=load;$("lockBothBtn").onclick=lockBoth;$("manualBtn").onclick=manualResult;if($("prevBtn"))$("prevBtn").onclick=previousDraw;$("nextBtn").onclick=nextDraw;$("regenLegacyBtn").onclick=buildLegacyPortfolio;$("rebuildHybridBtn").onclick=buildHybridPortfolio;'''
          repl='''$("refreshBtn").onclick=load;if($("targetSelect"))$("targetSelect").onchange=chooseTargetFromSelect;$("lockBothBtn").onclick=lockBoth;$("manualBtn").onclick=manualResult;if($("prevBtn"))$("prevBtn").onclick=previousDraw;$("nextBtn").onclick=nextDraw;$("regenLegacyBtn").onclick=buildLegacyPortfolio;$("rebuildHybridBtn").onclick=buildHybridPortfolio;'''
          assert anchor in s, 'app wire anchor not found'
          s=s.replace(anchor,repl,1)
          p.write_text(s)

          # tests/browser-smoke.mjs
          p=Path('tests/browser-smoke.mjs')
          s=p.read_text()
          anchor='''  // Result is deliberately outside the main navigation after RC9.4.\n  assert.equal(await page.locator('.rc94ResultDock').count(), 1, `${name}: Result Dock missing`);'''
          repl='''  // Draw selector mirrors Mega UX while preserving Power setTarget/replay semantics.\n  const targetSelect = page.locator('#targetSelect');\n  assert.equal(await targetSelect.count(), 1, `${name}: Power target selector missing`);\n  await page.waitForFunction(() => {\n    const s=document.getElementById('targetSelect');\n    return !!s && !s.disabled && s.options.length >= 2;\n  }, null, { timeout: 90000 });\n  const targetOptions = await targetSelect.locator('option').evaluateAll(opts => opts.map(o => o.value));\n  const initialTarget = Number((await page.locator('#targetId').innerText()).replace(/\\D/g,''));\n  const replayValue = targetOptions.find(v => Number(v) < initialTarget);\n  assert.ok(replayValue, `${name}: selector has no historical draw option`);\n  await targetSelect.selectOption(replayValue);\n  await page.waitForFunction(v => Number(String(document.getElementById('targetId')?.textContent||'').replace(/\\D/g,''))===Number(v), replayValue, { timeout: 90000 });\n  const replayCutoff = Number((await page.locator('#cutoffId').innerText()).replace(/\\D/g,''));\n  const replayTarget = Number((await page.locator('#targetId').innerText()).replace(/\\D/g,''));\n  assert.ok(replayCutoff < replayTarget, `${name}: selector replay leaked target/future history`);\n  await targetSelect.selectOption(String(initialTarget));\n  await page.waitForFunction(v => Number(String(document.getElementById('targetId')?.textContent||'').replace(/\\D/g,''))===Number(v), String(initialTarget), { timeout: 90000 });\n\n  // Result is deliberately outside the main navigation after RC9.4.\n  assert.equal(await page.locator('.rc94ResultDock').count(), 1, `${name}: Result Dock missing`);'''
          assert anchor in s, 'browser smoke anchor not found'
          s=s.replace(anchor,repl,1)
          p.write_text(s)
          PY

          node --check app.js
          npm run build
          cmp -s app.js dist/app.js
          cmp -s index.html dist/index.html
          cmp -s style.css dist/style.css
          git diff --check

      - name: Commit selector changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js style.css tests/browser-smoke.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add Power draw target selector"
          git push origin HEAD:feature/power-target-selector
