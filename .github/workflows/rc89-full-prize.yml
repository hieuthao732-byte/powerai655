name: RC8.9 Full Prize Board

on:
  push:
    paths:
      - '.github/workflows/rc89-full-prize.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply RC8.9 full prize board
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          let build = fs.readFileSync('build.mjs', 'utf8');
          if (!build.includes('RC8.9 FULL PRIZE BOARD')) {
            const anchor = '  writeFileSync(path, app);\n}\n\nfunction patchHtml() {';
            if (!build.includes(anchor)) throw new Error('build.mjs anchor not found');

            const patch = String.raw`
  /* RC8.9 FULL PRIZE BOARD */
  app = app.replace(
    'function seeded(seed){',
    [
      "function currentSpecialForTarget(){const log=typeof getLog==='function'?getLog(targetId):null;const ls=validSpecial(log?.special);if(ls!==null)return ls;const d=(draws||[]).find(x=>Number(x.id)===Number(targetId));return d?specialNum(d):null}",
      "function prizeInfo(ticket,actual,special){const r=scorePrizeTicket(ticket,actual,special);if(r.jp1)return{key:'jp1',label:'JACKPOT 1',detail:'Hit 6/6 số chính'};if(r.jp2)return{key:'jp2',label:'JACKPOT 2',detail:'Hit 5/6 chính + số đặc biệt'};if(r.first)return{key:'first',label:'GIẢI NHẤT',detail:'Hit 5/6 số chính'};if(r.second)return{key:'second',label:'GIẢI NHÌ',detail:'Hit 4/6 số chính'};if(r.third)return{key:'third',label:'GIẢI BA',detail:'Hit 3/6 số chính'};if(r.mainHits===5&&validSpecial(special)===null)return{key:'pending5',label:'5/6 SỐ CHÍNH',detail:'Chờ số đặc biệt để phân loại Jackpot 2 / Giải Nhất'};return{key:'none',label:'CHƯA TRÚNG GIẢI',detail:'Hit '+r.mainHits+'/6 số chính'}}",
      "function prizeBadge(ticket,actual,special){if(!actual||!actual.length)return '';const p=prizeInfo(ticket,actual,special);return '<div class=\"ticketPrize '+p.key+'\"><b>'+p.label+'</b><span>'+p.detail+'</span></div>'}",
      "function prizeBalls(a,actual=[],special=null){const s=new Set(actual||[]),sp=validSpecial(special);return a.map(n=>{const main=s.has(n),spec=!main&&sp!==null&&n===sp,cls=main?'hit':spec?'specialHit':'',title=spec?'Số đặc biệt':'Số '+String(n).padStart(2,'0');return '<span title=\"'+title+'\" class=\"ball '+cls+'\">'+String(n).padStart(2,'0')+'</span>'}).join('')}",
      'function seeded(seed){'
    ].join('\\n')
  );

  const ticketBallLine = '    <div class="balls">' + '${balls(p.a,actual)}' + '</div>';
  const ticketPrizeLine = '    <div class="balls">' + '${prizeBalls(p.a,actual,currentSpecialForTarget())}' + '</div>\\n    ' + '${prizeBadge(p.a,actual,currentSpecialForTarget())}';
  app = app.replaceAll(ticketBallLine, ticketPrizeLine);

  const compareBase = '...(sp!==null?[["Jackpot 2 • 5 chính + số đặc biệt",log.A.jp2??0,log.B.jp2??0,log.C.jp2??0],["Giải Nhất • 5 số chính",log.A.first??0,log.B.first??0,log.C.first??0]]:[])';
  const compareFull = '...(sp!==null?[["Jackpot 2 • 5 chính + số đặc biệt",log.A.jp2??0,log.B.jp2??0,log.C.jp2??0],["Giải Nhất • 5 số chính",log.A.first??0,log.B.first??0,log.C.first??0]]:[]),\\n    ["Giải Nhì • 4 số chính",log.A.second??0,log.B.second??0,log.C.second??0],\\n    ["Giải Ba • 3 số chính",log.A.third??0,log.B.third??0,log.C.third??0]';
  if(!app.includes(compareBase)) throw new Error('RC8.9 compare prize anchor missing');
  app = app.replace(compareBase, compareFull);

  const replayBase = '...(validSpecial(special)!==null?[["Jackpot 2 • 5 chính + số đặc biệt",A.jp2??0,B.jp2??0,C.jp2??0],["Giải Nhất • 5 số chính",A.first??0,B.first??0,C.first??0]]:[]),';
  const replayFull = '...(validSpecial(special)!==null?[["Jackpot 2 • 5 chính + số đặc biệt",A.jp2??0,B.jp2??0,C.jp2??0],["Giải Nhất • 5 số chính",A.first??0,B.first??0,C.first??0]]:[]),\\n    ["Giải Nhì • 4 số chính",A.second??0,B.second??0,C.second??0],\\n    ["Giải Ba • 3 số chính",A.third??0,B.third??0,C.third??0],';
  if(!app.includes(replayBase)) throw new Error('RC8.9 replay prize anchor missing');
  app = app.replace(replayBase, replayFull);
`;

            build = build.replace(anchor, patch + '\n  writeFileSync(path, app);\n}\n\nfunction patchHtml() {');
          }

          build = build.replaceAll('RC8.8 patch failed', 'RC8.9 patch failed');
          build = build.replace("html = html.replace(/RC8\\.6/g, 'RC8.8').replace(/v=8\\.6/g, 'v=8.8');", "html = html.replace(/RC8\\.6/g, 'RC8.9').replace(/v=8\\.6/g, 'v=8.9');");
          build = build.replace('RC8.8 SEO content + Jackpot 2 enabled', 'RC8.9 Full Prize Board + SEO enabled');
          fs.writeFileSync('build.mjs', build);

          let css = fs.readFileSync('style.css', 'utf8');
          if (!css.includes('RC8.9 FULL PRIZE BOARD')) {
            css += `\n\n/* RC8.9 FULL PRIZE BOARD */\n.ticketPrize{margin-top:9px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 9px;border:1px solid var(--line);border-radius:10px;background:rgba(6,19,31,.7)}\n.ticketPrize b{font-size:10px;letter-spacing:.045em}.ticketPrize span{font-size:9px;color:var(--muted)}\n.ticketPrize.jp1{border-color:rgba(255,201,107,.68);box-shadow:inset 0 0 24px rgba(255,201,107,.08)}\n.ticketPrize.jp1 b{color:var(--amber)}\n.ticketPrize.jp2{border-color:rgba(169,138,255,.60);box-shadow:inset 0 0 24px rgba(169,138,255,.08)}\n.ticketPrize.jp2 b{color:#d8c9ff}\n.ticketPrize.first b{color:var(--green)}\n.ticketPrize.second b{color:var(--cyan)}\n.ticketPrize.third b{color:var(--blue)}\n.ticketPrize.pending5 b{color:var(--amber)}\n.ticketPrize.none{opacity:.72}\n.ball.specialHit{color:#261b02;background:linear-gradient(180deg,#ffe7a6,#ffc96b);border-color:#ffeab6;box-shadow:0 0 0 2px rgba(255,201,107,.28),0 5px 12px rgba(185,128,28,.18)}\n`;
            fs.writeFileSync('style.css', css);
          }

          let index = fs.readFileSync('index.html', 'utf8');
          index = index.replaceAll('RC8.6', 'RC8.9').replaceAll('v=8.6', 'v=8.9');
          index = index.replace(
            'Khi có kết quả, hệ thống tự tính vé trúng nhiều số nhất và số vé đạt từ 2, 3, 4 số trở lên.',
            'Khi có kết quả, hệ thống hiển thị số hit và phân loại Jackpot 1, Jackpot 2, Giải Nhất, Giải Nhì, Giải Ba cho từng bộ vé.'
          );
          fs.writeFileSync('index.html', index);

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '8.9.0';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Commit RC8.9
        shell: bash
        run: |
          git config user.name "hieuthao732-byte"
          git config user.email "hieuthao732@gmail.com"
          git add build.mjs style.css index.html package.json
          if git diff --cached --quiet; then
            echo "No RC8.9 changes needed"
          else
            git commit -m "RC8.9 show Jackpot 2 and all prize tiers"
            git push origin main
          fi
