name: Phase 5 D Integrity Wiring

on:
  push:
    branches:
      - feature/adaptive-track-d

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/adaptive-track-d
      - name: Add strict D snapshot integrity guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('adaptive-d-ui.js')
          s=p.read_text()

          anchor="""  const D=window.PowerAIAdaptiveD;\n  if(!D){console.error('Track D core missing');return}\n\n  const LOCK_PREFIX='powerai_rc6_d_lock_';"""
          insert="""  const D=window.PowerAIAdaptiveD;\n  if(!D){console.error('Track D core missing');return}\n\n  const INTEGRITY_VERSION='D-INTEGRITY-1';\n  const GENERATOR_CONFIG={count:20,candidates:3600,maxExposure:4};\n\n  function verifyLockIntegrity(lock){\n    const checks={ticketShape:false,portfolioHash:false,audit:false,cutoff:false,modelHash:false,rebuild:false};\n    try{\n      const target=Number(lock?.targetId),tickets=Array.isArray(lock?.tickets)?lock.tickets:[];\n      checks.ticketShape=Number.isFinite(target)&&tickets.length===20&&tickets.every(t=>Array.isArray(t)&&t.length===6&&new Set(t).size===6&&t.every(n=>Number.isInteger(Number(n))&&Number(n)>=1&&Number(n)<=D.N));\n      if(!checks.ticketShape)throw new Error('ticket-shape');\n      checks.portfolioHash=typeof lock?.portfolioHash==='string'&&D.hashPortfolio(tickets)===lock.portfolioHash;\n      const audit=D.auditPortfolio(tickets),saved=lock?.audit;\n      checks.audit=!saved||['tickets','coverage','minExposure','maxExposure','repeatedPairs','maxOverlap','entropy'].every(k=>Number(saved[k])===Number(audit[k]));\n      const model=D.buildModel(draws,target,{engineId:lock.engineId,weights:lock.weights,horizons:lock.horizons});\n      checks.cutoff=Number(model.cutoffId)===Number(lock.cutoffId)&&Number(model.cutoffId)<target;\n      checks.modelHash=String(model.modelHash)===String(lock.modelHash);\n      const g={...GENERATOR_CONFIG,...(lock.generator||{})},seed=Number(lock.seed);\n      if(Number.isFinite(seed)){\n        const rebuilt=D.buildPortfolio(model,{count:Number(g.count)||20,candidates:Number(g.candidates)||3600,maxExposure:Number(g.maxExposure)||4,seed});\n        checks.rebuild=rebuilt.tickets.length===20&&rebuilt.hash===lock.portfolioHash;\n      }\n      const failed=Object.entries(checks).filter(([,v])=>!v).map(([k])=>k),ok=failed.length===0;\n      return{version:INTEGRITY_VERSION,ok,status:ok?'VERIFIED':'INVALID',checkedAt:new Date().toISOString(),checks,reason:ok?'Snapshot dựng lại khớp hoàn toàn.':'Sai kiểm tra: '+failed.join(', ')};\n    }catch(e){\n      return{version:INTEGRITY_VERSION,ok:false,status:'INVALID',checkedAt:new Date().toISOString(),checks,reason:'Không dựng lại được snapshot: '+String(e?.message||e)};\n    }\n  }\n\n  const LOCK_PREFIX='powerai_rc6_d_lock_';"""
          assert anchor in s, 'core anchor missing'
          s=s.replace(anchor,insert,1)

          old="""          <div class=\"dStat\"><span>Engine</span><b id=\"dEngine\">—</b><small id=\"dModelHash\">—</small></div>"""
          new="""          <div class=\"dStat\"><span>Engine</span><b id=\"dEngine\">—</b><small id=\"dModelHash\">—</small><small id=\"dIntegrity\">integrity —</small></div>"""
          assert old in s, 'engine stat anchor missing'
          s=s.replace(old,new,1)

          old="""    el('dModelHash').textContent='model '+currentModel.modelHash+' • cutoff #'+String(currentModel.cutoffId).padStart(5,'0');\n    el('dState').textContent=drift.state;"""
          new="""    el('dModelHash').textContent='model '+currentModel.modelHash+' • cutoff #'+String(currentModel.cutoffId).padStart(5,'0');\n    const integrity=lock?.integrity;\n    el('dIntegrity').textContent='integrity '+(integrity?.status|| (lock?'CHỜ KIỂM TRA':'CANDIDATE'));\n    el('dState').textContent=drift.state;"""
          assert old in s, 'render integrity anchor missing'
          s=s.replace(old,new,1)

          old="""      const conf=D.confidenceGate(currentModel),obj={version:D.VERSION,targetId:Number(targetId),cutoffId:currentModel.cutoffId,lockedAt:new Date().toISOString(),engineId:currentModel.engineId,weights:currentModel.weights,horizons:currentModel.horizons,modelHash:currentModel.modelHash,portfolioHash:currentPortfolio.hash,seed:currentPortfolio.seed,audit:currentPortfolio.audit,confidence:conf,tickets:currentPortfolio.tickets};\n      writeJSON(dLockKey(targetId),obj);showToast?.(`Đã khóa bộ D cho ${drawLabel(targetId)}.`, 'good');renderModel();"""
          new="""      const conf=D.confidenceGate(currentModel),obj={version:D.VERSION,targetId:Number(targetId),cutoffId:currentModel.cutoffId,lockedAt:new Date().toISOString(),engineId:currentModel.engineId,weights:currentModel.weights,horizons:currentModel.horizons,modelHash:currentModel.modelHash,portfolioHash:currentPortfolio.hash,seed:currentPortfolio.seed,generator:{...GENERATOR_CONFIG},audit:currentPortfolio.audit,confidence:conf,tickets:currentPortfolio.tickets};\n      const integrity=verifyLockIntegrity(obj);\n      if(!integrity.ok)return showToast?.('D không khóa vì snapshot không dựng lại khớp: '+integrity.reason,'bad');\n      obj.integrity=integrity;writeJSON(dLockKey(targetId),obj);showToast?.(`Đã khóa bộ D cho ${drawLabel(targetId)} • integrity VERIFIED.`, 'good');renderModel();"""
          assert old in s, 'lock anchor missing'
          s=s.replace(old,new,1)

          old="""      const id=Number(lock.targetId),draw=officialDraw(id);if(!draw||byId.has(id)||!Array.isArray(lock.tickets)||lock.tickets.length!==20)continue;\n      const actual=nums(draw),sp=specialNum(draw);if(actual.length!==6)continue;\n      const s=typeof scoreTrack==='function'?scoreTrack(lock.tickets,actual,sp):D.scorePortfolio(lock.tickets,actual);"""
          new="""      const id=Number(lock.targetId),draw=officialDraw(id);if(!draw||byId.has(id)||!Array.isArray(lock.tickets)||lock.tickets.length!==20)continue;\n      const integrity=verifyLockIntegrity(lock);\n      if(!integrity.ok){\n        if(lock.integrity?.status!==integrity.status||lock.integrity?.reason!==integrity.reason)writeJSON(dLockKey(id),{...lock,integrity});\n        console.error('Track D snapshot integrity failed',id,integrity);continue;\n      }\n      if(lock.integrity?.version!==INTEGRITY_VERSION||lock.integrity?.status!=='VERIFIED')writeJSON(dLockKey(id),{...lock,integrity});\n      const actual=nums(draw),sp=specialNum(draw);if(actual.length!==6)continue;\n      const s=typeof scoreTrack==='function'?scoreTrack(lock.tickets,actual,sp):D.scorePortfolio(lock.tickets,actual);"""
          assert old in s, 'official scoring anchor missing'
          s=s.replace(old,new,1)

          old="""      const row={targetId:id,source:'feed',actual,special:sp,cutoffId:lock.cutoffId,engineId:lock.engineId,modelHash:lock.modelHash,portfolioHash:lock.portfolioHash,lockedAt:lock.lockedAt,scoredAt:new Date().toISOString(),D:{...s,null:{trials:nul.trials,bestMean:nul.bestMean,totalMean:nul.totalMean,pBest:nul.pBest,pTotal:nul.pTotal}}};"""
          new="""      const row={targetId:id,source:'feed',actual,special:sp,cutoffId:lock.cutoffId,engineId:lock.engineId,modelHash:lock.modelHash,portfolioHash:lock.portfolioHash,integrity:{version:integrity.version,status:integrity.status,checks:integrity.checks},lockedAt:lock.lockedAt,scoredAt:new Date().toISOString(),D:{...s,null:{trials:nul.trials,bestMean:nul.bestMean,totalMean:nul.totalMean,pBest:nul.pBest,pTotal:nul.pTotal}}};"""
          assert old in s, 'official row anchor missing'
          s=s.replace(old,new,1)

          old="""  window.PowerAIAdaptiveDApp={refresh:refreshD,getLogs:dLogs,getLock:getDLock,getState:dState,saveState:saveDState};"""
          new="""  window.PowerAIAdaptiveDApp={refresh:refreshD,getLogs:dLogs,getLock:getDLock,getState:dState,saveState:saveDState,verifyLockIntegrity};"""
          assert old in s, 'app export anchor missing'
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('tests/adaptive-d-browser.mjs'); s=p.read_text()
          anchor="""assert.equal(await page.locator('#dCopyBtn').isDisabled(),false,'D copy should be enabled after build');\n"""
          add="""assert.equal(await page.locator('#dCopyBtn').isDisabled(),false,'D copy should be enabled after build');\n\n// D14 reproducibility guard: a prospective lock must rebuild to the same model + portfolio hash.\nawait page.locator('#dLockBtn').click();\nawait page.waitForFunction(()=>/VERIFIED/.test(document.querySelector('#dIntegrity')?.textContent||''),null,{timeout:90000});\nconst integrity=await page.evaluate(()=>{\n  const id=Number((document.querySelector('#targetId')?.textContent||'').replace(/\\D/g,''));\n  const x=JSON.parse(localStorage.getItem('powerai_rc6_d_lock_'+id)||'null');\n  return x?.integrity||null;\n});\nassert.equal(integrity?.ok,true,'D lock integrity must be verified');\nassert.ok(Object.values(integrity?.checks||{}).every(Boolean),'Every D integrity check must pass');\n"""
          assert anchor in s, 'browser anchor missing'
          s=s.replace(anchor,add,1)
          p.write_text(s)

          p=Path('tests/adaptive-d-ui-static.mjs'); s=p.read_text()
          anchor="""assert.match(ui,/hasAnyKnownResult/);\n"""
          add="""assert.match(ui,/hasAnyKnownResult/);\nassert.match(ui,/verifyLockIntegrity/);\nassert.match(ui,/D-INTEGRITY-1/);\nassert.match(ui,/integrity VERIFIED/);\nassert.match(ui,/generator:\{\.\.\.GENERATOR_CONFIG\}/);\n"""
          assert anchor in s, 'static test anchor missing'
          s=s.replace(anchor,add,1)
          p.write_text(s)

          Path('ADAPTIVE_TRACK_D_PLAN.md').write_text('''# Track D — Adaptive Research Engine\n\n## Trạng thái\n- Phase 1 Core: xong\n- Phase 2 App integration: xong\n- Phase 3 Adaptive cycle: xong\n- Phase 4 Validation Lab: xong\n- Phase 5 Integrity hardening: xong D14 snapshot reproducibility guard\n\n## Engine\n- D1 Residual Pair Matrix\n- D2 Gap Transition Matrix\n- D3 Shape-Conditional Matrix\n- D4 Spectral Residual Graph\n- Multi-horizon: 30 / 60 / 120 / 250\n- Stability penalty + matched-random benchmark\n- 20 vé D deterministic, diversity/exposure/entropy guard\n\n## Adaptive cycle\n- Rolling drift detector\n- Champion / tối đa 2 challenger\n- Shadow >= 6 kỳ official\n- Stress gate trước promote\n- Slow weight update, quarantine expert yếu\n- Negative memory + hypothesis registry + lineage\n- Orthogonality so A/B/C/L\n\n## Validation\n- Historical walk-forward, cutoff luôn `< target`\n- Counterfactual Lab\n- Change-point flag so matched-null\n- Marginal novelty audit\n- Bayesian paired evidence\n- Validation không ghi vào official log / weights / promotion\n\n## D14 Integrity Guard\nMỗi lock prospective lưu model hash, portfolio hash, seed và generator config. Trước khi chấm feed official, D phải dựng lại snapshot và pass toàn bộ:\n- ticket shape hợp lệ;\n- portfolio hash khớp;\n- audit khớp;\n- cutoff `< target` và đúng snapshot;\n- model hash khớp;\n- tái sinh 20 vé từ seed cho cùng portfolio hash.\n\nNếu fail bất kỳ mục nào: `INVALID`, không ghi official D log và không dùng kỳ đó cho adaptive learning.\n\n## Quy tắc dữ liệu\n- Chỉ `source === feed` được dùng cho official learning.\n- Manual và Replay không train.\n- Không dùng target/future draw để build feature.\n- Score nội bộ không phải xác suất trúng.\n''')
          PY

          git diff --check
          node --check adaptive-d-ui.js
          node tests/adaptive-d-ui-static.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adaptive-d-ui.js tests/adaptive-d-browser.mjs tests/adaptive-d-ui-static.mjs ADAPTIVE_TRACK_D_PLAN.md
          git commit -m "Add Track D snapshot integrity guard"
          git push origin HEAD:feature/adaptive-track-d
